<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRLM - магазин автозапчатсей</title>
    <link rel="stylesheet" href="../general/reset.css">
    <link rel="stylesheet" href="../general/font/stylesheet.css">
    <link rel="stylesheet" href="../index/scss/style.css">
    <link rel="icon" type="image/png" href="../general/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../general/favicon/favicon.svg" />
    <link rel="shortcut icon" href="../general/faviconfavicon.ico" type="image/x-icon"/>
    <link rel="apple-touch-icon" sizes="180x180" href="../general/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="TRLM" />
    <link rel="manifest" href="../general/favicon/site.webmanifest" />
</head>
<body>
    <div class="wrapper">
        <section class="container-header">
            <header class="center">
                <div class="logo">
                    <a href="#"><img src="../general/logo.png" alt="logo"></a>
                </div>
                <div class="catalog">
                    <button class="btn-city-search">Малиновского</button>
                    <button class="btn-catalog-search">Каталог</button>
                </div>
                <div class="navigation">
                    <div class="navigation-top">
                        <div class="navigation-top-right">
                            <div class="number">
                                <p>8-800-550-19-80</p>
                            </div>
                            <div class="navigation-pannel">
                                <a href="#">Подбор запчастей</a>
                                <a href="#">Доставка</a>
                                <a href="#">Как купить</a>  
                                <a href="#">Оплата</a>
                                <a href="#">Акции</a>
                                <a href="#">Контакты</a>
                            </div>
                        </div>
                        <div class="navigation-top-left">
                            <button>
                                <img src="../index/img/user.png" alt="user">
                                <span>Войти</span>
                            </button>
                            <button>
                                <img src="../index/img/cart.png" alt="user">
                                <span>Корзина</span>
                            </button>
                        </div>
                    </div>
                    <div class="navigation-bottom">
                        <form action="" class="navigation-search">
                            <input type="search" placeholder="Что ищете?">
                            <button class="search-btn">Все результаты</button>
                        </form>
                        <div class="search-overlay"></div>
                    </div>
                </div>
            </header>
        </section>

    </div>

</html>
